<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Feeder - TailAdmin Dashboard</title>
    
    <!-- External Libraries (CDNs) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Custom App Entry Point (ES6 Modules) -->
    <script type="module" src="js/app.js"></script>

    <style>
        body { background-color: #f1f5f9; color: #1e293b; font-family: 'Inter', sans-serif; }
        .sidebar { background-color: #1c2434; }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- Sidebar Left -->
    <aside class="sidebar w-64 min-h-screen text-slate-400 p-4 hidden md:flex flex-col justify-between shrink-0">
        <div>
            <div class="flex items-center gap-3 px-3 py-4 border-b border-slate-700/50 mb-6">
                <div class="bg-blue-600 text-white p-2 rounded-lg text-xl"><i class="fa-solid fa-fish"></i></div>
                <span class="text-white font-bold text-lg tracking-wide">FishAdmin</span>
            </div>
            <ul class="space-y-1">
                <li><a href="#" class="flex items-center gap-3 px-3 py-2 text-white bg-slate-800 rounded-lg font-medium text-sm"><i class="fa-solid fa-gauge-high text-blue-500"></i> Dashboard</a></li>
                <li><a href="#tableSection" class="flex items-center gap-3 px-3 py-2 hover:text-white text-sm"><i class="fa-solid fa-table"></i> Históriku Tabela</a></li>
            </ul>
        </div>
        <div class="px-3 py-4 text-xs text-slate-500">Fish Feeder v2.0</div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
            <h1 class="text-xl font-bold text-slate-800">IoT Dashboard</h1>
            <div class="flex items-center gap-4">
                <div id="statusBadge" class="flex items-center gap-2 bg-red-100 text-red-600 px-3 py-1 rounded-full text-xs font-semibold">
                    <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span> Deskonetadu
                </div>
            </div>
        </header>

        <!-- Body -->
        <main class="p-6 overflow-y-auto space-y-6">

            <!-- Stats -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Temp Card -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div class="w-11 h-11 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-lg"><i class="fa-solid fa-temperature-half"></i></div>
                    <div class="mt-4">
                        <h3 class="text-2xl font-bold text-slate-800" id="tempVal">-- °C</h3>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-xs text-slate-400 font-medium">Temperatura</span>
                            <span id="tempStatus" class="text-xs font-semibold text-slate-500">Hein...</span>
                        </div>
                    </div>
                </div>

                <!-- Food Card -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div class="w-11 h-11 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-lg"><i class="fa-solid fa-wheat-awn"></i></div>
                    <div class="mt-4">
                        <h3 class="text-2xl font-bold text-slate-800" id="foodVal">-- %</h3>
                        <div class="w-full bg-slate-100 h-1.5 rounded-full mt-3 overflow-hidden">
                            <div id="foodBar" class="bg-emerald-500 h-full w-0 transition-all duration-500"></div>
                        </div>
                    </div>
                </div>

                <!-- Control Feed -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div class="w-11 h-11 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center text-lg"><i class="fa-solid fa-bowl-food"></i></div>
                    <button id="btnFeed" class="mt-2 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-xl text-sm transition">
                        <i class="fa-solid fa-paper-plane mr-1"></i> Fó Han Agora
                    </button>
                </div>

                <!-- Total Log Card -->
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div class="w-11 h-11 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-lg"><i class="fa-solid fa-database"></i></div>
                    <div class="mt-4">
                        <h3 class="text-2xl font-bold text-slate-800" id="totalRecords">0</h3>
                        <span class="text-xs text-slate-400 font-medium">Registos iha Firebase</span>
                    </div>
                </div>
            </div>

            <!-- Charts & Control -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm lg:col-span-2">
                    <h2 class="text-base font-bold text-slate-800 mb-4">Monitórizasaun Temperatura</h2>
                    <div class="h-64"><canvas id="tempChart"></canvas></div>
                </div>

                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h2 class="text-base font-bold text-slate-800"><i class="fa-regular fa-clock text-blue-600"></i> Oráriu Fó Han</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs text-slate-500 font-medium mb-1">Dadaun 1</label>
                            <input type="time" id="sched1" value="07:00" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-500 font-medium mb-1">Dadaun 2</label>
                            <input type="time" id="sched2" value="17:00" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                        </div>
                    </div>
                    <button id="btnSchedule" class="w-full bg-slate-900 text-white font-medium py-2.5 rounded-xl text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Rai Oráriu
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div id="tableSection" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-bold text-slate-800">Históriku Dadus Firebase</h2>
                    <button id="btnRefreshTable" class="bg-slate-100 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-medium">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Refresh Tabela
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-slate-600">
                        <thead class="text-xs uppercase bg-slate-50 text-slate-400 font-semibold border-b border-slate-100">
                            <tr>
                                <th class="px-4 py-3">Tempo / Data</th>
                                <th class="px-4 py-3">Temperatura (°C)</th>
                                <th class="px-4 py-3">Nível Aihan (%)</th>
                                <th class="px-4 py-3">Status Temp</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</body>
</html>
